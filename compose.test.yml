services:
  postgres:
    image: postgres:17.11-bookworm@sha256:051f7b7b3abdd564d5d1bd1e8c4b9c1b6e77087d1dd22020ede611c096a272e0
    environment:
      POSTGRES_DB: review_tunnel_test
      POSTGRES_USER: review_tunnel_test
      POSTGRES_PASSWORD: local-test-only
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U review_tunnel_test -d review_tunnel_test"]
      interval: 2s
      timeout: 2s
      retries: 15
    tmpfs:
      - /var/lib/postgresql/data
