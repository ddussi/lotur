name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17.6-bookworm@sha256:f3bd19c606e442c3d7bdfa8002e03fe260a1023351e0ea4598032022b68dd6e3
        env:
          POSTGRES_USER: review_tunnel
          POSTGRES_PASSWORD: review_tunnel_test
          POSTGRES_DB: review_tunnel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U review_tunnel -d review_tunnel_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://review_tunnel:review_tunnel_test@127.0.0.1:5432/review_tunnel_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          package-manager-cache: false
      - run: npm ci
      - run: npm run check:release-version
      - run: npx playwright install --with-deps chrome
      - run: npm audit --omit=dev
      - run: npm run check:mvp
      - run: npm run test:demo
      - name: Build every production runtime image
        run: |
          docker build --target gateway -t review-tunnel-gateway:ci .
          docker build --target admin-cli -t review-tunnel-admin-cli:ci .
          docker build --target client -t review-tunnel-client:ci .
          docker build --target canary-check -t review-tunnel-canary-check:ci .
          docker build --target db-backup -t review-tunnel-db-backup:ci .
          docker build --target db-restore -t review-tunnel-db-restore:ci .
      - name: Smoke runtime entrypoints and fail-closed configuration
        run: |
          expect_failure() {
            expected="$1"
            shift
            set +e
            output=$("$@" 2>&1)
            status=$?
            set -e
            if [ "$status" -eq 0 ]; then
              echo "expected command to fail closed: $*" >&2
              exit 1
            fi
            case "$output" in
              *"$expected"*) ;;
              *)
                echo "runtime failed for an unexpected reason: $output" >&2
                exit 1
                ;;
            esac
          }
          expect_failure "METRICS_BEARER_TOKEN must contain at least 32" docker run --rm -e METRICS_BEARER_TOKEN=short review-tunnel-gateway:ci
          expect_failure "DATABASE_URL is required" docker run --rm review-tunnel-admin-cli:ci
          expect_failure "Usage:" docker run --rm review-tunnel-client:ci
          expect_failure "CANARY_CONTENT_URL is required" docker run --rm review-tunnel-canary-check:ci
          expect_failure "DATABASE_URL is required" docker run --rm review-tunnel-db-backup:ci
          expect_failure "usage: postgres-restore" docker run --rm review-tunnel-db-restore:ci
          expected_version=$(node -p "require('./package.json').version")
          actual_version=$(docker run --rm review-tunnel-client:ci --version)
          test "$actual_version" = "$expected_version"
      - name: Build source and installable release candidate files
        run: npm run pack:release
      - name: Retain verified candidate files for review
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-files-${{ github.sha }}-${{ github.run_attempt }}
          path: dist/releases/*/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    needs: verification
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      vars.AUTO_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      gateway: ${{ steps.images.outputs.gateway }}
      admin: ${{ steps.images.outputs.admin-cli }}
      canary: ${{ steps.images.outputs.canary-check }}
      current: ${{ steps.current.outputs.deploy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Publish the verified revision to GHCR
        id: images
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$REGISTRY_USER" --password-stdin
          repository="${GITHUB_REPOSITORY,,}"
          for target in gateway admin-cli canary-check; do
            image="ghcr.io/${repository}-${target}:${GITHUB_SHA}"
            docker build --target "$target" \
              --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
              --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
              -t "$image" .
            docker push "$image"
            digest=$(docker image inspect "$image" --format '{{index .RepoDigests 0}}')
            [[ "$digest" =~ @sha256:[a-f0-9]{64}$ ]]
            printf '%s=%s\n' "$target" "$digest" >> "$GITHUB_OUTPUT"
          done
      - name: Skip a revision superseded on main
        id: current
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          latest=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)
          if [ "$latest" = "$GITHUB_SHA" ]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
            echo 'A newer main revision exists; this deployment was skipped.' >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    needs: publish
    if: needs.publish.outputs.current == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
    concurrency:
      group: production-deployment
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Migrate, deploy, verify and restore on failure
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
          GATEWAY_IMAGE: ${{ needs.publish.outputs.gateway }}
          ADMIN_IMAGE: ${{ needs.publish.outputs.admin }}
          CANARY_IMAGE: ${{ needs.publish.outputs.canary }}
        run: python3 scripts/deploy-over-ssh.py
