<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A local example workspace for trying Review Tunnel." />
    <title>Fieldnotes — Launch workspace</title>
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <a class="brand" href="/" data-route="/"><span class="brand-mark" aria-hidden="true">f.</span>fieldnotes</a>
        <span class="demo-badge">Example workspace</span>
        <span class="avatar" aria-label="Demo user Ari">A</span>
      </header>
      <main>
        <nav class="tabs" aria-label="Workspace pages">
          <a href="/" data-route="/" aria-current="page">Overview</a>
          <a href="/details" data-route="/details">Launch brief</a>
        </nav>
        <section class="intro">
          <p class="eyebrow">THE NEXT CHAPTER</p>
          <h1>A calmer way<br>to launch.</h1>
          <p class="intro-copy">A little clarity goes a long way. Bring the final details<br class="desktop-break"> together, gather feedback, and make something good.</p>
          <button id="layout-toggle" class="subtle-button" aria-pressed="false">Try compact layout <span aria-hidden="true">↔</span></button>
        </section>
        <div id="view"></div>
        <footer><span>A small workspace. A shared point of view.</span><span>Local example · no external services</span></footer>
      </main>
    </div>
    <script type="module" src="/src/main.js"></script>
